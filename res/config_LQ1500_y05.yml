% ------------- %
% ---- JOB ---- %
% ------------- %

Job: "LQ_trex_m1500_y05"
  CmeLabel: "13 TeV"
  POI: mu-signal
  ReadFrom: NTUP
  OutputDir: /home/iutkarsh/LQ_analysis
  NtuplePath: /home/iutkarsh/fastframes_out
  Label: "LQ"
  LumiLabel: "140 fb^{-1}"
  Lumi: 1.0
  MCweight: "weight_total_NOSYS"
  NtupleName: "reco"
  MCstatThreshold: 0.01
  HistoChecks: NOCRASH
  SplitHistoFiles: TRUE
  ImageFormat: png
  DoSignalRegionsPlot: TRUE
  RatioYmin: 0.
  RatioYmax: 2.0
  ReplacementFile: /home/iutkarsh/LQ_analysis/replacements/replacement-friend.txt
  FriendPath: /home/iutkarsh/friend_ntuples
  DebugLevel: 2
  BlindingThreshold: 1
  #SeparationPlot: FakeMu, FakeEl, TauFakes
  PlotOptions: "YIELDS"
	#Selection: "(leps_IFFtype_0_NOSYS == 2 || leps_IFFtype_0_NOSYS == 4 || leps_IFFtype_0_NOSYS == 7) && (leps_IFFtype_1_NOSYS == 2 || leps_IFFtype_1_NOSYS == 4 || leps_IFFtype_1_NOSYS == 7)"
  # GetChi2: TRUE
  POIPrecision: 3

% --------- %
% -- FIT -- %
% --------- %

Fit: "fit"
  FitType: SPLUSB
  FitRegion: CRSR
  POIAsimov: 1
  # FitBlind: FALSE
  # BlindedParameters: "mu-signal"

% -------------------- %
% ------ LIMIT ------- %
% -------------------- %

Limit: "limit"
	LimitType: ASYMPTOTIC
	#LimitBlind: FALSE

% ------------------------- %
% ----- SIGNIFICANCE ------ %
% ------------------------- %

Significance: "significance"
 SignificanceType: ASYMPTOTIC
 POIAsimov: 1
 #SignificanceBlind: FALSE

